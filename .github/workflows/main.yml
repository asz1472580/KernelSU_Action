import { execSync } from "node:child_process";
import { existsSync, mkdirSync, rmSync } from "node:fs";
import { join } from "node:path";

// ========== 配置区域 ==========
const CONFIG = {
  kernelSource: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource",
  branch: "ares-t-oss",
  defconfig: "ares_defconfig",
  arch: "arm64",
  outputImage: "Image.gz-dtb",
  workDir: join(process.cwd(), "build"),
  kernelDir: join(process.cwd(), "build", "kernel"),
};

// ========== 工具函数 ==========
function run(cmd, cwd = process.cwd()) {
  console.log(`\n▶ ${cmd}`);
  execSync(cmd, { cwd, stdio: "inherit" });
}

function cleanBuildDir() {
  if (existsSync(CONFIG.workDir)) {
    console.log("🧹 清理旧的构建目录...");
    rmSync(CONFIG.workDir, { recursive: true });
  }
  mkdirSync(CONFIG.workDir, { recursive: true });
}

// ========== 编译步骤 ==========

// 第一步：克隆内核源码
function cloneKernel() {
  console.log("\n📥 第一步：下载内核源码...");
  run(
    `git clone --depth=1 -b ${CONFIG.branch} ${CONFIG.kernelSource} kernel`,
    CONFIG.workDir
  );
}

// 第二步：集成 ReSukiSU
function integrateReSukiSU() {
  console.log("\n🔧 第二步：集成 ReSukiSU...");
  run(
    'curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin',
    CONFIG.kernelDir
  );
}

// 第三步：编译内核
function buildKernel() {
  console.log("\n⚙️ 第三步：编译内核...");
  const env = {
    ...process.env,
    ARCH: CONFIG.arch,
    SUBARCH: CONFIG.arch,
    CROSS_COMPILE: "aarch64-linux-gnu-",
    CLANG_TRIPLE: "aarch64-linux-gnu-",
    CC: "clang",
  };

  run(`make ${CONFIG.defconfig}`, CONFIG.kernelDir);
  run(`make -j$(nproc) 2>&1 | tee kernel.log`, CONFIG.kernelDir);
}

// 第四步：检查编译产物
function checkOutput() {
  console.log("\n📦 第四步：检查编译产物...");
  const outputPath = join(
    CONFIG.kernelDir,
    "arch",
    CONFIG.arch,
    "boot",
    CONFIG.outputImage
  );

  if (existsSync(outputPath)) {
    console.log(`\n✅ 编译成功！产物位置：${outputPath}`);
  } else {
    console.error(`\n❌ 编译产物未找到：${outputPath}`);
    console.error("请检查编译日志排查错误。");
    process.exit(1);
  }
}

// ========== 主流程 ==========
console.log("🚀 开始内核编译流程（ares + ReSukiSU）\n");
console.log(`工作目录：${CONFIG.workDir}`);

cleanBuildDir();
cloneKernel();
integrateReSukiSU();
buildKernel();
checkOutput();

console.log("\n🎉 全部完成！");
